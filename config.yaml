  hidrolik:
    - { label: "YouTube: hidrolik ve pnömatik sistemler", url: "https://www.youtube.com/results?search_query=hydraulics+pneumatics+basics" }
  plc:
    - { label: "YouTube: Siemens TIA Portal PLC", url: "https://www.youtube.com/results?search_query=TIA+Portal+PLC+tutorial" }

match:
  # Açıklaması eksik LinkedIn ilanlarından en umut vericilerin tam metni çekilir (eğitim/deneyim şartı için)
  enrich_limit: 250
  backfill_days: 7            # önceki günlerden metni hâlâ eksik olan ilanlar da bu kadar gün geriye kadar tekrar denenir
  recheck_limit: 40           # her gün kapanıp kapanmadığı kontrol edilen eski ilan sayısı
  recheck_after_days: 5

scoring:
  # Claude API (isteğe bağlı). ANTHROPIC_API_KEY yoksa kural tabanlı eşleştirme kullanılır.
  model: claude-opus-5
  effort: low
  batch_size: 8
  max_llm_jobs: 40            # Claude'un günde yeniden değerlendireceği en fazla ilan (maliyet sınırı)
  letters_per_day: 3          # "Doğrudan uygun" ilanlar için sabah yazılan ön yazı sayısı
  letter_effort: medium
  # Maliyet tahmini için fiyatlar ($ / 1M token)
  price_input: 5.0
  price_output: 25.0

notify:
  telegram: true
  top_direct: 6               # mesajda gösterilecek "Doğrudan uygun" ilan sayısı
  top_fit: 4                  # "Uygun"
  top_stretch: 2              # "Stretch"

site:
  keep_days: 30               # sitede kaç günlük ilan tutulacak (düşük uygunluk: 7 gün)
