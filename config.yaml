# İş Radarı - ayarlar
# Değiştirdikten sonra bir sonraki günlük çalışmada geçerli olur.
# Kuralları/profili değiştirip mevcut ilanları yeniden sınıflandırmak için: python -m radar rebuild

profile:
  cv_file: cv/cv.md
  education:
    - "Lisans: Makine Mühendisliği, İstanbul Üniversitesi-Cerrahpaşa (2021-2026, mezun)"
    - "Yüksek lisans: Makine Mühendisliği (tezli), İstanbul Üniversitesi-Cerrahpaşa (2026-devam ediyor)"
  # Profilinde olan beceriler (radar/match.py > SKILLS içindeki anahtarlar). İlanlarda bunlar "✓ var" görünür,
  # listede olmayan araçlar "profilinde görünmüyor" olarak gösterilir. Yeni bir şey öğrendiğinde ekle.
  skills: [solidworks, ansys, fea, statik, modal, topoloji, cad, teknik_resim, tolerans, autocad, fusion, nx,
           matlab, excel, eklemeli, dfm, rca, cnc, uretim, prototip, ingilizce]
  languages: [tr, en]
  # Claude'un (API varsa) değerlendirmede ve ön yazıda kullandığı tercihler
  preferences: |
    - Makine Mühendisliği lisans mezunuyum (Temmuz 2026). Eylül 2026'dan beri tezli yüksek lisans yapıyorum.
    - İş ararken yüksek lisansla SINIRLI değilim: lisans mezunu olarak başvurabileceğim ilanlar tam
      önceliklidir. "Bachelor's degree", "lisans veya yüksek lisans", "yeni mezun" ilanları uygundur.
      Yüksek lisansım bir avantajdır, şart değildir.
    - Deneyim: yeni mezun / 0-2 yıl / junior / entry-level / graduate programları uygundur. 1-3 yıl isteyen
      ilanlar teknik örtüşme güçlüyse stretch'tir. 5+ yıl, senior, lead, yönetici pozisyonları düşük uygunluktur.
    - Staj ve öğrenci pozisyonları (working student, uzun dönem staj) da değerlendirilebilir.
    - Staj, Formula Student, TEKNOFEST, bitirme ve tasarım projelerim gerçek uygulamalı deneyimdir.
    - Güçlü olduğum alanlar: SolidWorks ile tasarım ve teknik resim, ANSYS Mechanical ile statik/modal FEA,
      topoloji optimizasyonu, eklemeli imalat (FDM), üretim süreçleri (talaşlı imalat), kök neden analizi.
    - Sektör sınırım yok: otomotiv, havacılık, savunma, makine/ekipman, beyaz eşya, enerji, robotik,
      mühendislik danışmanlığı, Ar-Ge, eklemeli imalat ve diğerleri.
    - Lokasyon önceliği: İstanbul > diğer sanayi şehirleri > Türkiye > uzaktan > yurt dışı. Lokasyon
      uygunluğu değiştirmez.
    - Diller: Türkçe (ana dil), İngilizce (B2). Almanca / Fransızca bilmiyorum.

search:
  # LinkedIn herkese açık ilan araması (giriş gerektirmez). hours: son kaç saatin ilanları.
  linkedin:
    enabled: true
    hours: 24
    delay_seconds: 6          # istekler arası bekleme (engellenmemek için)
    max_pages: 1              # varsayılan sayfa sayısı (sayfa başı ~10 ilan); sorgu bazında "pages" ile değişir
    queries:
      # Sorgu verimi her taramada data/query_stats.json'a yazılır (toplam / ilgili ilan). Verimsizleri buradan ayıkla.
      # ---- Türkiye: geniş başlıklar
      - { keywords: "makine mühendisi", location: "Turkey", pages: 4 }
      - { keywords: "mechanical engineer", location: "Turkey", pages: 2 }
      - { keywords: "tasarım mühendisi", location: "Turkey", pages: 2 }
      - { keywords: "tasarım mühendisi SolidWorks", location: "Turkey" }
      - { keywords: "mechanical design engineer", location: "Turkey" }
      - { keywords: "Ar-Ge mühendisi", location: "Turkey", pages: 2 }
      - { keywords: "Ar-Ge mühendisi yeni mezun", location: "Turkey" }
      - { keywords: "R&D engineer", location: "Turkey" }
      - { keywords: "ürün geliştirme mühendisi", location: "Turkey" }
      - { keywords: "product development engineer", location: "Turkey" }
      # ---- Türkiye: analiz / simülasyon
      - { keywords: "analiz mühendisi", location: "Turkey" }
      - { keywords: "FEA", location: "Turkey" }
      - { keywords: "CAE engineer", location: "Turkey" }
      - { keywords: "simulation engineer", location: "Turkey" }
      # ---- Türkiye: üretim / test / otomotiv / eklemeli
      - { keywords: "üretim mühendisi", location: "Turkey" }
      - { keywords: "üretim mühendisi yeni mezun", location: "Turkey" }
      - { keywords: "manufacturing engineer", location: "Turkey" }
      - { keywords: "proses mühendisi", location: "Turkey" }
      - { keywords: "test mühendisi", location: "Turkey" }
      - { keywords: "validation engineer", location: "Turkey" }
      - { keywords: "otomotiv mühendis", location: "Turkey" }
      - { keywords: "additive manufacturing", location: "Turkey" }
      # ---- Türkiye: yeni mezun / junior / staj / araştırma
      - { keywords: "yeni mezun mühendis", location: "Turkey", pages: 3 }
      - { keywords: "mühendis adayı", location: "Turkey" }
      - { keywords: "Smart Start", location: "Turkey" }
      - { keywords: "junior engineer", location: "Istanbul" }
      - { keywords: "stajyer mühendis", location: "Turkey" }
      - { keywords: "bursiyer", location: "Turkey" }
      - { keywords: "araştırma görevlisi makine", location: "Turkey" }
      # ---- Yurt dışı: İngilizce ilan veren ülkeler (deneyim filtresi: 1=staj, 2=giriş, 3=associate)
      #      (AB genelindeki tasarım/FEA aramaları çoğunlukla Fransızca/Almanca ilan getiriyordu)
      - { keywords: "mechanical design engineer", location: "Netherlands", experience: "1,2,3" }
      - { keywords: "mechanical design engineer", location: "Ireland", experience: "1,2,3" }
      - { keywords: "mechanical design engineer", location: "Denmark", experience: "1,2,3" }
      - { keywords: "mechanical design engineer", location: "Sweden", experience: "1,2,3" }
      - { keywords: "mechanical design engineer", location: "United Kingdom", experience: "1,2,3" }
      - { keywords: "FEA engineer", location: "Netherlands", experience: "1,2,3" }
      - { keywords: "FEA engineer", location: "United Kingdom", experience: "1,2,3" }
      - { keywords: "FEA engineer", location: "Ireland", experience: "1,2,3" }
      # ---- Yurt dışı: AB geneli, verimli olanlar
      - { keywords: "additive manufacturing engineer", location: "European Union", experience: "1,2,3" }
      - { keywords: "graduate mechanical engineer", location: "European Union", pages: 2 }
      - { keywords: "R&D mechanical engineer", location: "European Union", experience: "1,2,3" }
      - { keywords: "PhD additive manufacturing", location: "European Union" }
      - { keywords: "PhD finite element", location: "European Union" }

  euraxess:
    enabled: true
    pages: 12                 # en yeni ilanlardan kaç sayfa taranacak (sayfa başı ~10)

  smartrecruiters:
    enabled: true
    # SmartRecruiters kullanan şirketler (careers.smartrecruiters.com/<id>). country: ülke kodu (boşsa tüm dünya)
    companies:
      - { id: BoschGroup, country: tr }
    detail_limit: 80          # tam metni çekilecek en fazla ilan

  # ---- Şirket kariyer siteleri (resmi, herkese açık sistemler; LinkedIn'e bağımlı değil)
  workday:
    enabled: true
    detail_limit: 80
    tenants:
      - { tenant: hitachi, wd: wd1, site: hitachi, company: "Hitachi Energy", search: ["Turkey", "Türkiye"] }
      - { tenant: geaerospace, wd: wd5, site: GE_ExternalSite, company: "GE Aerospace", search: ["Türkiye", "Istanbul"] }
      - { tenant: borgwarner, wd: wd5, site: BorgWarner_Careers, company: "BorgWarner", search: ["Türkiye"] }
      - { tenant: bakerhughes, wd: wd5, site: BakerHughes, company: "Baker Hughes", search: ["Türkiye"] }

  hrpeak:
    enabled: true
    detail_limit: 80
    portals:
      - { company: "ROKETSAN", base: "https://kariyer.roketsan.com.tr", pages: 5 }
      - { company: "TEI", base: "https://tei.hrpeak.com", pages: 3 }

  baykar:
    enabled: true
    detail_limit: 60

  # Lever / Ashby modülleri hazır; şu an Türkiye/Avrupa'da uygun ilanı olan şirket bulunamadı
  # (Velo3D ve 1X'te sadece ABD'de satış rolleri vardı). Şirket ekleyince enabled: true yap.
  lever:
    enabled: false
    companies:
      - { slug: velo3d, company: "Velo3D" }          # metal eklemeli imalat

  ashby:
    enabled: false
    companies:
      - { slug: 1x, company: "1X Technologies" }     # insansı robotik

  greenhouse:
    enabled: true
    # Greenhouse kullanan şirketlerin pano adları (boards.greenhouse.io/<ad>)
    boards: [formlabs, markforged, carbon]
    # Sadece bu konumları eşleyen ilanlar alınır
    location_regex: "(Turkey|Türkiye|Istanbul|Germany|Netherlands|Belgium|France|Italy|Spain|Austria|Switzerland|Sweden|Denmark|Finland|Norway|Poland|Czech|Hungary|Portugal|Ireland|United Kingdom|UK|Europe|EMEA|Remote)"

# Hedef şirketler: sitede "Hedef şirketler" panelinde açık ilan sayısı ve kariyer linkiyle görünür;
# priority: true olanların ilanları kendi kategorisi içinde üste çıkar (kategori değişmez).
# match: ilan şirket adında aranacak düzenli ifade (küçük harf, Türkçe harfler sadeleştirilmiş).
companies:
  - { name: "ASELSAN", match: "aselsan", careers_url: "https://www.aselsan.com/tr/kariyer", priority: true }
  - { name: "ROKETSAN", match: "roketsan", careers_url: "https://kariyer.roketsan.com.tr/jobs", priority: true }
  - { name: "TUSAŞ", match: "tusas|turk havacilik", careers_url: "https://kariyer.tusas.com/", priority: true }
  - { name: "TEI", match: "\\btei\\b|tusas motor", careers_url: "https://tei.hrpeak.com/jobs", priority: true }
  - { name: "Baykar", match: "baykar", careers_url: "https://kariyer.baykartech.com/tr/", priority: true }
  - { name: "Ford Otosan", match: "ford otosan|ford", careers_url: "https://www.fordotosan.com.tr/", priority: true }
  - { name: "TOFAŞ", match: "tofas", careers_url: "https://www.tofas.com.tr/", priority: true }
  - { name: "Mercedes-Benz Türk", match: "mercedes", careers_url: "https://www.mercedes-benz.com.tr/", priority: true }
  - { name: "Bosch", match: "bosch", careers_url: "https://careers.smartrecruiters.com/BoschGroup", priority: true }
  - { name: "Arçelik", match: "arcelik|beko", careers_url: "https://www.arcelikglobal.com/", priority: true }
  - { name: "BSH", match: "\\bbsh\\b", careers_url: "https://www.bsh-group.com/tr/tr/kariyer/bshye-hos-geldi", priority: false }
  - { name: "Siemens", match: "siemens", careers_url: "https://jobs.siemens.com/careers", priority: false }
  - { name: "Otokar", match: "otokar", careers_url: "https://www.otokar.com.tr/", priority: false }
  - { name: "BMC", match: "\\bbmc\\b", careers_url: "https://www.bmc.com.tr/", priority: false }
  - { name: "FNSS", match: "fnss", careers_url: "https://www.fnss.com.tr/", priority: false }
  - { name: "Kale Pratt & Whitney", match: "kale pratt|pratt", careers_url: "https://www.kalepw.com/", priority: false }
  - { name: "Hitachi Energy", match: "hitachi", careers_url: "https://hitachi.wd1.myworkdayjobs.com/hitachi", priority: false }
  - { name: "GE Aerospace", match: "ge aerospace|\\bgeae\\b", careers_url: "https://geaerospace.wd5.myworkdayjobs.com/GE_ExternalSite", priority: false }

# Beceri yol haritası: sitede "sık istenen ama profilinde görünmeyen" araçların yanında gösterilen kaynaklar.
# Anahtarlar radar/match.py > SKILLS ile aynı. Bir aracı öğrenince profile.skills listesine ekle.
