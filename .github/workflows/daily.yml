name: Günlük tarama

on:
  schedule:
    - cron: "0 5 * * *"      # her gün 08:00 (Türkiye saati, UTC+3)
  workflow_dispatch:          # Actions sekmesinden elle çalıştırma
    inputs:
      hours:
        description: "LinkedIn'de kaç saat geriye bakılsın (ilk çalıştırmada 168 = 7 gün)"
        required: false
        default: "24"

permissions:
  contents: write            # data/ ve site/data.json'u geri commit etmek için
  pages: write               # siteyi GitHub Pages'e yayınlamak için
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      - name: Testler
        run: |
          python -m pytest tests -q
          node --test tests/js/*.test.js

      - name: Tarama
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://mmerterdogan.github.io/is-radari/' }}
        run: python -m radar run --hours "${{ github.event.inputs.hours || 24 }}"

      - name: Sonuçları kaydet
        run: |
          git config user.name "is-radari-bot"
          git config user.email "is-radari-bot@users.noreply.github.com"
          git add data site/data.json site/profile.json
          git diff --cached --quiet || git commit -m "tarama $(date -u +%F)"
          git push

      - name: Hata bildirimi (Telegram)
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] || exit 0
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"             --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"             --data-urlencode "text=⚠️ İş Radarı: ${{ github.workflow }} başarısız oldu. Ayrıntı: ${RUN_URL}"

  # Siteyi (site/ klasörü) taramanın hemen ardından yayınla
  deploy:
    needs: scan
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
